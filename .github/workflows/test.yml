name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun test:coverage

      - uses: codecov/codecov-action@v6
        with:
          files: web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun test:coverage

      - uses: codecov/codecov-action@v6
        with:
          files: backend/functions/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
